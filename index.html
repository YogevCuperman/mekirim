<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מכירים?">
<title>מכירים?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1530; --bg2:#251d40; --card:#2d2450; --line:#3d3366;
  --txt:#f4f0ff; --mut:#a99fcc; --a:#ff7aa8; --b:#7ad7ff; --acc:#ffd36e; --ok:#6ee7a8; --no:#ff8a8a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Heebo,system-ui,sans-serif;font-size:16px}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:24px;flex:1;display:flex;align-items:center;gap:8px}
.venn{width:30px;height:20px;position:relative}
.venn i{position:absolute;top:0;width:20px;height:20px;border-radius:50%;opacity:.85}
.venn i:first-child{right:0;background:var(--a)} .venn i:last-child{left:0;background:var(--b);mix-blend-mode:screen}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:19px}
.who{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg2);color:var(--mut);font-weight:500;font-size:15px}
.tab.on{background:var(--txt);color:var(--bg)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:99px;background:var(--a);color:#fff;font-size:12px;line-height:20px;text-align:center}
.filters{display:flex;gap:8px;margin-top:10px}
.filters input,.filters select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.filters input{flex:1}
main{padding:6px 16px}
.hint{color:var(--mut);font-size:14px;margin:4px 2px 12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.ctop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.chip{background:var(--bg2);border-radius:99px;padding:3px 10px;color:var(--acc);font-weight:500}
.ctop .sp{flex:1}
.ctitle{font-size:19px;font-weight:700;margin:8px 0 2px}
.cnote{font-size:14px;color:var(--mut);white-space:pre-wrap}
.mrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.mrow .lbl{font-size:13px;font-weight:700;min-width:52px}
.pill{padding:7px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.pill.yes.on{background:var(--ok);color:#10301f;border-color:var(--ok);font-weight:700}
.pill.no.on{background:var(--no);color:#3a0f0f;border-color:var(--no);font-weight:700}
.stars{display:flex;gap:2px;direction:ltr}
.stars button{font-size:24px;line-height:1;color:#5a4f86;padding:2px}
.stars button.on{color:var(--acc)}
.prow{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--mut);display:flex;align-items:center;gap:8px}
.prow b{color:var(--txt)}
.sm{font-size:16px;color:var(--acc);letter-spacing:1px;direction:ltr;display:inline-block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.empty{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.7}
.empty .big{font-size:44px}
.fab{position:fixed;left:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--a),#b57aff);color:#fff;font-size:34px;box-shadow:0 8px 24px #0008;z-index:6}
/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:32px;font-weight:800}
.kpi .k{font-size:13px;color:var(--mut)}
.kpi.wide{grid-column:1/-1}
.ring{display:flex;align-items:center;gap:16px}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a));border-radius:99px}
.catrow{margin:10px 0}
.catrow .t{display:flex;justify-content:space-between;font-size:14px}
.sect{font-weight:700;margin:18px 2px 8px}
.fav{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
/* sheet */
.back{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:21px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.field textarea{min-height:70px;resize:vertical}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.cats button.on{background:var(--acc);color:#3a2a00;border-color:var(--acc);font-weight:700}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--txt);color:var(--bg);font-weight:700;font-size:17px;margin-top:8px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--no);border:1px solid var(--no)}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:40;font-weight:500;font-size:14px}
/* setup */
.setup{max-width:560px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 20px 40px}
.setup h1{font-size:30px;margin:10px 0 6px}
.setup p{color:var(--mut);line-height:1.6}
.pick{display:grid;gap:12px;margin-top:20px}
.pick button{padding:22px;border-radius:var(--r);font-size:22px;font-weight:800;color:#1b1530}
code{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px;direction:ltr;display:inline-block}
.small{font-size:13px;color:var(--mut)}
.linkbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;direction:ltr;word-break:break-all;color:var(--mut);max-height:90px;overflow:auto}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.off i{background:var(--no)}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const FB_VER = '10.12.2';
const DEFAULT_CATS = ['סרטים','סדרות','שירים','אמנים','ספרים'];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- storage backends ---------- */
function localStore(){
  const KEY='mk_demo';
  let data=LS.get(KEY,{meta:null,items:{}});
  const L={meta:new Set(),items:new Set()};
  const emit=()=>{L.meta.forEach(f=>f(data.meta));L.items.forEach(f=>f(Object.entries(data.items).map(([id,v])=>({id,...v}))))};
  const save=()=>{LS.set(KEY,data);emit()};
  window.addEventListener('storage',e=>{if(e.key===KEY){data=LS.get(KEY,data);emit()}});
  return {
    online:true,
    onMeta(cb){L.meta.add(cb);cb(data.meta)},
    onItems(cb){L.items.add(cb);cb(Object.entries(data.items).map(([id,v])=>({id,...v})))},
    async setMeta(m){data.meta={...(data.meta||{}),...m};save()},
    async add(it){data.items[rid(12)]=it;save()},
    async rate(id,who,val){const r={...(data.items[id].r||{})};if(val==null)delete r[who];else r[who]=val;data.items[id].r=r;save()},
    async edit(id,p){Object.assign(data.items[id],p);save()},
    async del(id){delete data.items[id];save()}
  };
}
async function firebaseStore(fb,room,onStatus){
  const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app.js`);
  const fs=await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-firestore.js`);
  const app=initializeApp(fb);
  let db;
  try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}
  catch(e){db=fs.getFirestore(app)}
  const roomRef=fs.doc(db,'rooms',room);
  const col=fs.collection(roomRef,'items');
  const err=e=>{console.error(e);onStatus(false,e.code==='permission-denied'?'אין הרשאה — בדקו את חוקי Firestore':'בעיית חיבור')};
  return {
    onMeta(cb){fs.onSnapshot(roomRef,{includeMetadataChanges:true},s=>{onStatus(!s.metadata.fromCache);cb(s.data()||null)},err)},
    onItems(cb){fs.onSnapshot(col,s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)},
    setMeta(m){return fs.setDoc(roomRef,m,{merge:true})},
    add(it){return fs.addDoc(col,it)},
    rate(id,who,val){return fs.updateDoc(fs.doc(col,id),{['r.'+who]:val==null?fs.deleteField():val})},
    edit(id,p){return fs.updateDoc(fs.doc(col,id),p)},
    del(id){return fs.deleteDoc(fs.doc(col,id))}
  };
}

/* ---------- app state ---------- */
const S={cfg:LS.get('mk_cfg'),me:LS.get('mk_me'),meta:null,items:[],tab:'todo',q:'',cat:'',store:null,online:true,statusMsg:''};
const other=()=>S.me==='a'?'b':'a';
const name=w=>S.meta?.names?.[w]||(w==='a'?'אני':'השני/ה');
const cats=()=>S.meta?.cats||DEFAULT_CATS;
const color=w=>w==='a'?'var(--a)':'var(--b)';

/* handle join link */
(function(){
  const m=location.hash.match(/join=([^&]+)/);
  if(!m)return;
  try{
    const j=b64d(m[1]);
    if(j.fb&&j.room){
      const changed=!S.cfg||S.cfg.room!==j.room;
      S.cfg={mode:'fb',fb:j.fb,room:j.room};LS.set('mk_cfg',S.cfg);
      if(changed){S.me=null;LS.del('mk_me')}
      if(j.me){S.me=j.me;LS.set('mk_me',j.me)}
    }
  }catch(e){console.error(e)}
  history.replaceState(null,'',location.pathname+location.search);
})();

function inviteLink(forWho){
  const base=location.origin+location.pathname;
  return base+'#join='+b64e({fb:S.cfg.fb,room:S.cfg.room,me:forWho});
}

/* ---------- setup screens ---------- */
function parseCfg(txt){
  const out={};
  for(const m of txt.matchAll(/(\w+)\s*["']?\s*:\s*["']([^"']+)["']/g))out[m[1]]=m[2];
  return out.apiKey&&out.projectId?out:null;
}
function renderSetup(){
  $('#app').innerHTML=`
  <div class="setup">
    <div class="venn" style="transform:scale(1.8);transform-origin:right"><i></i><i></i></div>
    <h1>מכירים?</h1>
    <p>אפליקציה לשניים: מכניסים דברים שאוהבים — סרטים, שירים, ספרים, מה שבא — וכל אחד מסמן מה הוא מכיר ונותן דירוג.</p>
    <div class="field"><label>השם שלך</label><input id="nA" value="יוגבר"></div>
    <div class="field"><label>השם שלה/שלו</label><input id="nB" value="טלטול"></div>
    <div class="field"><label>הגדרות Firebase (הדביקו את firebaseConfig מהקונסול)</label>
      <textarea id="cfg" dir="ltr" placeholder='const firebaseConfig = {&#10;  apiKey: "...",&#10;  projectId: "...",&#10;  ...&#10;};'></textarea>
      <div class="small">אין עדיין? אפשר להתחיל במצב ניסיון ולחבר אחר כך.</div>
    </div>
    <button class="btn" id="go">יצירת חדר משותף</button>
    <button class="btn ghost" id="demo">מצב ניסיון (רק במכשיר הזה)</button>
  </div>`;
  const names=()=>({a:$('#nA').value.trim()||'אני',b:$('#nB').value.trim()||'השני/ה'});
  $('#go').onclick=async()=>{
    const fb=parseCfg($('#cfg').value);
    if(!fb){toast('לא הצלחתי לקרוא את ההגדרות — חסר apiKey או projectId');return}
    S.cfg={mode:'fb',fb,room:rid(24)};S.me='a';
    LS.set('mk_cfg',S.cfg);LS.set('mk_me','a');
    await boot({names:names(),cats:DEFAULT_CATS,created:Date.now()});
    openInvite();
  };
  $('#demo').onclick=async()=>{
    S.cfg={mode:'demo'};S.me='a';LS.set('mk_cfg',S.cfg);LS.set('mk_me','a');
    await boot({names:names(),cats:DEFAULT_CATS,created:Date.now()});
  };
}
function renderPickMe(){
  $('#app').innerHTML=`
  <div class="setup">
    <div class="venn" style="transform:scale(1.8);transform-origin:right"><i></i><i></i></div>
    <h1>מי את/ה?</h1>
    <p>בוחרים פעם אחת — המכשיר יזכור.</p>
    <div class="pick">
      <button style="background:var(--a)" data-w="a">${esc(name('a'))}</button>
      <button style="background:var(--b)" data-w="b">${esc(name('b'))}</button>
    </div>
  </div>`;
  document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{S.me=b.dataset.w;LS.set('mk_me',S.me);render()});
}

/* ---------- main UI ---------- */
function shell(){
  $('#app').innerHTML=`
  <header>
    <div class="hrow">
      <div class="logo"><div class="venn"><i></i><i></i></div>מכירים?</div>
      <div id="sync" class="sync"></div>
      <button class="iconbtn" id="set" aria-label="הגדרות">⚙️</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters">
      <input id="q" type="search" placeholder="חיפוש…">
      <select id="cat"></select>
    </div>
  </header>
  <main id="list"></main>
  <button class="fab" id="add" aria-label="הוספה">+</button>`;
  $('#q').oninput=e=>{S.q=e.target.value;renderList()};
  $('#cat').onchange=e=>{S.cat=e.target.value;renderList()};
  $('#add').onclick=()=>openItem();
  $('#set').onclick=openSettings;
  $('#list').addEventListener('click',onListClick);
}
const mine=it=>it.r?.[S.me];
const theirs=it=>it.r?.[other()];
function filtered(arr){
  const q=S.q.trim().toLowerCase();
  return arr.filter(it=>(!S.cat||it.cat===S.cat)&&(!q||(it.title+' '+(it.note||'')).toLowerCase().includes(q)));
}
function renderTabs(){
  const todo=S.items.filter(it=>!mine(it)).length;
  const learn=S.items.filter(it=>theirs(it)?.k&&!mine(it)?.k).length;
  const T=[['todo','לסמן',todo],['learn',`להכיר מ${name(other())}`,learn],['all','הכל',0],['stats','סטטיסטיקה',0]];
  $('#tabs').innerHTML=T.map(([k,l,n])=>`<button class="tab ${S.tab===k?'on':''}" data-t="${k}">${esc(l)}${n?`<span class="n">${n}</span>`:''}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render();scrollTo(0,0)});
  const sel=$('#cat');
  sel.innerHTML=`<option value="">כל הקטגוריות</option>`+cats().map(c=>`<option ${c===S.cat?'selected':''}>${esc(c)}</option>`).join('');
  $('#filters').classList.toggle('hidden',S.tab==='stats');
  const sy=$('#sync');
  if(S.cfg.mode==='demo'){sy.className='sync';sy.innerHTML='מצב ניסיון'}
  else{sy.className='sync'+(S.online?'':' off');sy.innerHTML=`<i></i>${S.online?'מסונכרן':esc(S.statusMsg||'לא מחובר')}`}
}
function starsHTML(id,s){
  return `<div class="stars">${[1,2,3,4,5].map(n=>`<button data-act="star" data-id="${id}" data-s="${n}" class="${n<=s?'on':''}" aria-label="${n}">★</button>`).join('')}</div>`;
}
function staticStars(s){return s?`<span class="sm">${'★'.repeat(s)}<span style="color:#5a4f86">${'★'.repeat(5-s)}</span></span>`:''}
function card(it){
  const m=mine(it),t=theirs(it),o=other();
  let p;
  if(!t)p=`<span>${esc(name(o))}: עוד לא סימן/ה</span>`;
  else if(!m)p=`<span>🔒 ${esc(name(o))} כבר סימן/ה — סמנו כדי לראות</span>`;
  else p=t.k?`<span><b>${esc(name(o))}:</b> מכיר/ה</span> ${staticStars(t.s)}`:`<span><b>${esc(name(o))}:</b> לא מכיר/ה</span>`;
  return `<div class="card">
    <div class="ctop"><span class="chip">${esc(it.cat)}</span><span class="sp"></span>
      <span><span class="dot" style="background:${color(it.by)}"></span> ${esc(name(it.by))}</span>
      <button data-act="edit" data-id="${it.id}" style="color:var(--mut);padding:2px 6px">✎</button></div>
    <div class="ctitle">${esc(it.title)}</div>
    ${it.note?`<div class="cnote">${esc(it.note)}</div>`:''}
    <div class="mrow"><span class="lbl" style="color:${color(S.me)}">אני</span>
      <button class="pill yes ${m?.k===true?'on':''}" data-act="k" data-id="${it.id}" data-v="1">✓ מכיר/ה</button>
      <button class="pill no ${m?.k===false?'on':''}" data-act="k" data-id="${it.id}" data-v="0">✗ לא</button>
      ${m?.k?starsHTML(it.id,m.s||0):''}
    </div>
    <div class="prow"><span class="dot" style="background:${color(o)}"></span>${p}</div>
  </div>`;
}
function renderList(){
  const el=$('#list');
  if(S.tab==='stats'){el.innerHTML=statsHTML();return}
  let arr=[...S.items],hint='',empty='';
  if(S.tab==='todo'){
    arr=arr.filter(it=>!mine(it)).sort((x,y)=>(y.ts||0)-(x.ts||0));
    hint='פריטים שעוד לא סימנת.';empty='<div class="big">🎉</div>סימנת הכל!<br>אפשר להוסיף עוד עם ה־+';
  }else if(S.tab==='learn'){
    arr=arr.filter(it=>theirs(it)?.k&&!mine(it)?.k).sort((x,y)=>(theirs(y).s||0)-(theirs(x).s||0));
    hint=`דברים ש${name(other())} מכיר/ה ואת/ה לא — מסודרים לפי הדירוג שלו/ה.`;
    empty=`<div class="big">🤝</div>אין כרגע משהו ש${esc(name(other()))} מכיר/ה ואת/ה לא.`;
  }else{
    arr.sort((x,y)=>(y.ts||0)-(x.ts||0));
    empty='<div class="big">📭</div>עוד אין כלום.<br>לחצו על ה־+ כדי להוסיף את הדבר הראשון.';
  }
  arr=filtered(arr);
  el.innerHTML=arr.length?(hint?`<div class="hint">${esc(hint)}</div>`:'')+arr.map(card).join(''):`<div class="empty">${S.items.length||S.tab!=='all'?empty:empty}</div>`;
}
function onListClick(e){
  const b=e.target.closest('[data-act]');if(!b)return;
  const it=S.items.find(x=>x.id===b.dataset.id);if(!it)return;
  const m=mine(it);
  if(b.dataset.act==='k'){
    const k=b.dataset.v==='1';
    if(m&&m.k===k)S.store.rate(it.id,S.me,null);
    else S.store.rate(it.id,S.me,{k,s:k?(m?.s||0):0,t:Date.now()});
  }else if(b.dataset.act==='star'){
    const s=+b.dataset.s;
    S.store.rate(it.id,S.me,{k:true,s:m?.s===s?0:s,t:Date.now()});
  }else if(b.dataset.act==='edit')openItem(it);
}

/* ---------- stats ---------- */
function statsHTML(){
  const a=S.me,o=other();
  const both=S.items.filter(it=>it.r?.a&&it.r?.b);
  const calc=list=>{
    const any=list.filter(it=>it.r.a.k||it.r.b.k);
    const bk=list.filter(it=>it.r.a.k&&it.r.b.k);
    return {any:any.length,both:bk.length,pct:any.length?Math.round(bk.length/any.length*100):0,bk};
  };
  const all=calc(both);
  const rated=all.bk.filter(it=>it.r.a.s&&it.r.b.s);
  const taste=rated.length?Math.round(100-rated.reduce((s,it)=>s+Math.abs(it.r.a.s-it.r.b.s),0)/rated.length/4*100):null;
  const onlyMe=both.filter(it=>it.r[a].k&&!it.r[o].k).length;
  const onlyThem=both.filter(it=>it.r[o].k&&!it.r[a].k).length;
  const pending=S.items.length-both.length;
  const catRows=cats().map(c=>({c,...calc(both.filter(it=>it.cat===c))})).filter(x=>x.any);
  const favs=[...rated].sort((x,y)=>(y.r.a.s+y.r.b.s)-(x.r.a.s+x.r.b.s)).slice(0,5);
  const fights=[...rated].filter(it=>Math.abs(it.r.a.s-it.r.b.s)>=2).sort((x,y)=>Math.abs(y.r.a.s-y.r.b.s)-Math.abs(x.r.a.s-x.r.b.s)).slice(0,5);
  if(!S.items.length)return `<div class="empty"><div class="big">📊</div>הסטטיסטיקה תופיע אחרי שתוסיפו ותסמנו כמה דברים.</div>`;
  return `
  <div class="kpis">
    <div class="kpi wide"><div class="k">אחוז חפיפה</div><div class="v">${all.pct}%</div>
      <div class="bar"><i style="width:${all.pct}%"></i></div>
      <div class="small" style="margin-top:6px">מתוך ${all.any} דברים שלפחות אחד מכם מכיר — ${all.both} ששניכם מכירים</div></div>
    <div class="kpi"><div class="k">התאמת טעם</div><div class="v">${taste==null?'—':taste+'%'}</div><div class="small">לפי דירוגים של ${rated.length} פריטים</div></div>
    <div class="kpi"><div class="k">ממתינים לסימון</div><div class="v">${pending}</div><div class="small">מתוך ${S.items.length} פריטים</div></div>
    <div class="kpi"><div class="k">רק ${esc(name(a))} מכיר/ה</div><div class="v" style="color:${color(a)}">${onlyMe}</div></div>
    <div class="kpi"><div class="k">רק ${esc(name(o))} מכיר/ה</div><div class="v" style="color:${color(o)}">${onlyThem}</div></div>
  </div>
  ${catRows.length?`<div class="sect">חפיפה לפי קטגוריה</div><div class="card">${catRows.map(x=>`
    <div class="catrow"><div class="t"><span>${esc(x.c)}</span><span>${x.pct}% · ${x.both}/${x.any}</span></div><div class="bar"><i style="width:${x.pct}%"></i></div></div>`).join('')}</div>`:''}
  ${favs.length?`<div class="sect">❤️ האהובים של שניכם</div><div class="card">${favs.map(it=>`<div class="fav"><span>${esc(it.title)}</span><span class="sm">${((it.r.a.s+it.r.b.s)/2).toFixed(1)}★</span></div>`).join('')}</div>`:''}
  ${fights.length?`<div class="sect">⚔️ איפה אתם לא מסכימים</div><div class="card">${fights.map(it=>`<div class="fav"><span>${esc(it.title)}</span><span class="small"><span style="color:${color(a)}">${esc(name(a))} ${it.r[a].s}★</span> · <span style="color:${color(o)}">${esc(name(o))} ${it.r[o].s}★</span></span></div>`).join('')}</div>`:''}
  `;
}

/* ---------- sheets ---------- */
function sheet(html,onMount){
  const bk=document.createElement('div');bk.className='back';
  bk.innerHTML=`<div class="sheet">${html}</div>`;
  bk.onclick=e=>{if(e.target===bk)bk.remove()};
  document.body.appendChild(bk);
  onMount?.(bk,()=>bk.remove());
}
function openItem(it){
  let cat=it?.cat||S.cat||cats()[0];
  sheet(`
    <h2>${it?'עריכה':'הוספת פריט'}</h2>
    <div class="field"><label>שם</label><input id="t" value="${esc(it?.title||'')}" placeholder="למשל: הסנדק / Bohemian Rhapsody / הארי פוטר"></div>
    <div class="field"><label>קטגוריה</label><div class="cats" id="cs"></div></div>
    <div class="field"><label>הערה (לא חובה)</label><textarea id="n" placeholder="למה זה חשוב לי, איפה לראות/לשמוע…">${esc(it?.note||'')}</textarea></div>
    ${it?'':`<div class="field"><label>אני…</label><div class="cats" id="mk">
      <button data-k="1" class="on">✓ מכיר/ה</button><button data-k="0">✗ לא מכיר/ה</button><button data-k="">אסמן אחר כך</button></div></div>`}
    <button class="btn" id="save">${it?'שמירה':'הוספה'}</button>
    ${it?'<button class="btn danger" id="delb">מחיקה</button>':''}
  `,(bk,close)=>{
    const drawCats=()=>{$('#cs',bk).innerHTML=cats().map(c=>`<button data-c="${esc(c)}" class="${c===cat?'on':''}">${esc(c)}</button>`).join('')+`<button data-new="1">+ חדשה</button>`};
    drawCats();
    $('#cs',bk).onclick=async e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.new){const c=prompt('שם הקטגוריה החדשה');if(c&&c.trim()){cat=c.trim();if(!cats().includes(cat))await S.store.setMeta({cats:[...cats(),cat]});drawCats()}return}
      cat=b.dataset.c;drawCats();
    };
    let mk='1';
    $('#mk',bk)?.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mk=b.dataset.k;bk.querySelectorAll('#mk button').forEach(x=>x.classList.toggle('on',x===b))});
    setTimeout(()=>$('#t',bk).focus(),50);
    $('#save',bk).onclick=async()=>{
      const title=$('#t',bk).value.trim();if(!title){toast('צריך שם');return}
      const note=$('#n',bk).value.trim();
      if(it){await S.store.edit(it.id,{title,cat,note});close();return}
      const dup=S.items.find(x=>x.title.trim().toLowerCase()===title.toLowerCase());
      if(dup&&!confirm(`"${dup.title}" כבר קיים ב${dup.cat}. להוסיף בכל זאת?`))return;
      const r={};if(mk!=='')r[S.me]={k:mk==='1',s:0,t:Date.now()};
      close();
      await S.store.add({title,cat,note,by:S.me,ts:Date.now(),r});
      toast('נוסף ✓');
    };
    $('#delb',bk)?.addEventListener('click',async()=>{if(confirm('למחוק את "'+it.title+'"?')){await S.store.del(it.id);close()}});
  });
}
function openInvite(){
  const link=inviteLink(other());
  sheet(`
    <h2>הזמנה ל${esc(name(other()))}</h2>
    <p class="small" style="line-height:1.6">שלחו את הקישור הזה. כשהוא נפתח בטלפון השני, האפליקציה מתחברת לאותו חדר ומזהה אוטומטית מי זה. אחר כך: "הוספה למסך הבית" בדפדפן.</p>
    <div class="linkbox">${esc(link)}</div>
    <button class="btn" id="share">שיתוף הקישור</button>
    <button class="btn ghost" id="mylink">קישור למכשיר נוסף שלי</button>
    <button class="btn ghost" id="cl">סגירה</button>
  `,(bk,close)=>{
    const share=async(url,txt)=>{
      if(navigator.share){try{await navigator.share({title:'מכירים?',text:txt,url});return}catch(e){if(e.name==='AbortError')return}}
      try{await navigator.clipboard.writeText(url);toast('הקישור הועתק')}catch(e){prompt('העתיקו:',url)}
    };
    $('#share',bk).onclick=()=>share(link,`בואי נגלה מה כל אחד מאיתנו מכיר 🙂`);
    $('#mylink',bk).onclick=()=>share(inviteLink(S.me),'הקישור שלי');
    $('#cl',bk).onclick=close;
  });
}
function openSettings(){
  sheet(`
    <h2>הגדרות</h2>
    <div class="field"><label>שמות</label><div class="btnrow">
      <input id="na" value="${esc(name('a'))}" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0">
      <input id="nb" value="${esc(name('b'))}" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0"></div></div>
    <div class="field"><label>קטגוריות (מופרדות בפסיק)</label><input id="cc" value="${esc(cats().join(', '))}"></div>
    <button class="btn" id="sv">שמירה</button>
    ${S.cfg.mode==='fb'?'<button class="btn ghost" id="inv">קישור הזמנה</button>':'<button class="btn ghost" id="tofb">חיבור ל־Firebase (סנכרון בין טלפונים)</button>'}
    <button class="btn ghost" id="sw">אני בעצם ${esc(name(other()))}</button>
    <button class="btn ghost" id="exp">ייצוא גיבוי (JSON)</button>
    <button class="btn danger" id="rs">התנתקות מהחדר במכשיר הזה</button>
    <p class="small" style="margin-top:14px">${S.cfg.mode==='fb'?'חדר: <code>'+esc(S.cfg.room.slice(0,6))+'…</code> · פרויקט: <code>'+esc(S.cfg.fb.projectId)+'</code>':'מצב ניסיון — הנתונים נשמרים רק בדפדפן הזה.'}</p>
  `,(bk,close)=>{
    $('#sv',bk).onclick=async()=>{
      const cs=$('#cc',bk).value.split(',').map(s=>s.trim()).filter(Boolean);
      await S.store.setMeta({names:{a:$('#na',bk).value.trim()||'אני',b:$('#nb',bk).value.trim()||'השני/ה'},cats:cs.length?cs:DEFAULT_CATS});
      close();toast('נשמר');
    };
    $('#inv',bk)?.addEventListener('click',()=>{close();openInvite()});
    $('#tofb',bk)?.addEventListener('click',()=>{close();migrateToFb()});
    $('#sw',bk).onclick=()=>{S.me=other();LS.set('mk_me',S.me);close();render()};
    $('#exp',bk).onclick=()=>{
      const blob=new Blob([JSON.stringify({meta:S.meta,items:S.items},null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mekirim-backup.json';a.click();
    };
    $('#rs',bk).onclick=()=>{if(confirm('להתנתק? (הנתונים בענן לא נמחקים)')){LS.del('mk_cfg');LS.del('mk_me');location.reload()}};
  });
}
function migrateToFb(){
  sheet(`
    <h2>חיבור ל־Firebase</h2>
    <p class="small">הדביקו את firebaseConfig. כל מה שהוספתם במצב ניסיון יועבר לחדר החדש.</p>
    <div class="field"><textarea id="cfg" dir="ltr" style="min-height:140px"></textarea></div>
    <button class="btn" id="go">חיבור</button>
  `,(bk,close)=>{
    $('#go',bk).onclick=async()=>{
      const fb=parseCfg($('#cfg',bk).value);if(!fb){toast('לא הצלחתי לקרוא את ההגדרות');return}
      const old={meta:S.meta,items:S.items};
      S.cfg={mode:'fb',fb,room:rid(24)};LS.set('mk_cfg',S.cfg);
      close();
      await boot(old.meta);
      for(const {id,...it} of old.items)await S.store.add(it);
      openInvite();
    };
  });
}

/* ---------- boot ---------- */
function render(){
  if(!S.cfg){renderSetup();return}
  if(!S.store)return;
  if(!S.me){if(S.meta)renderPickMe();return}
  if(!$('#list'))shell();
  renderTabs();renderList();
}
async function boot(initMeta){
  $('#app').innerHTML='<div class="empty"><div class="big">⏳</div>מתחבר…</div>';
  try{
    S.store=S.cfg.mode==='demo'?localStore():await firebaseStore(S.cfg.fb,S.cfg.room,(ok,msg)=>{S.online=ok;S.statusMsg=msg||'';if($('#sync'))renderTabs()});
  }catch(e){
    console.error(e);
    $('#app').innerHTML=`<div class="setup"><h1>שגיאה בחיבור</h1><p>${esc(e.message)}</p><button class="btn" onclick="localStorage.clear();location.reload()">התחלה מחדש</button></div>`;
    return;
  }
  if(initMeta)await S.store.setMeta(initMeta);
  let first=true;
  S.store.onMeta(m=>{S.meta=m;if(first&&!m&&S.cfg.mode==='demo'){S.store.setMeta({names:{a:'אני',b:'השני/ה'},cats:DEFAULT_CATS})}first=false;if(!S.me||!$('#list'))render();else renderTabs(),renderList()});
  S.store.onItems(items=>{S.items=items;if(S.me&&S.meta)render()});
}
if(S.cfg)boot();else render();
</script>
</body>
</html>
